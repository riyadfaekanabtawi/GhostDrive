name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            preset: default
          - name: linux-ubsan
            os: ubuntu-latest
            preset: ubsan
          # No asan job: ASan binaries hang at startup on macOS (see CLAUDE.md), and UBSan on
          # Linux covers the sanitizer run.
          - name: macos
            os: macos-latest
            preset: default
    env:
      # The presets set VCPKG_BINARY_SOURCES=clear, so vcpkg keeps no binary cache. In CI the
      # vcpkg installed tree lives outside the build directory and is cached between runs;
      # vcpkg reuses every package whose ABI hash still matches. Local builds are unaffected.
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        # libavahi-client-dev builds the Avahi LAN discovery backend. The LAN tests skip when no
        # avahi-daemon is running on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfuse3-dev libavahi-client-dev

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf

      - name: Install FUSE-T (macOS)
        if: runner.os == 'macOS'
        # Only so the FUSE front end is compiled and linked; mount tests are not run (below).
        # Without FUSE-T the build still succeeds and simply skips the FUSE front end.
        continue-on-error: true
        run: brew install --cask fuse-t

      - name: Bootstrap vcpkg
        id: vcpkg
        run: |
          ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "commit=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg installed tree
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.commit }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-

      - name: Configure
        id: configure
        run: cmake --preset ${{ matrix.preset }} -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"

      # Saved right after configure (where vcpkg installs), so a failing build or test does not
      # throw away the dependency build.
      - name: Save vcpkg installed tree
        if: always() && steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Mount and e2e tests need a working FUSE device (/dev/fuse on Linux, FUSE-T on macOS),
      # which hosted runners do not provide reliably, so they are excluded here. Run them
      # locally with `ctest --preset default -L mount` and `-L e2e`.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE "mount|e2e"

  # Windows builds with clang-cl: the same Clang front end as the Linux and macOS jobs, so the
  # C++20 and coroutine behaviour and the warnings match, while it stays ABI-compatible with the
  # MSVC-built x64-windows vcpkg packages and the MSVC standard library. WinFsp is installed so
  # the WinFsp front end is built and its mount tests and the e2e scripts (in Git Bash) run.
  windows:
    name: windows
    runs-on: windows-latest
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Ninja needs the compiler environment that vcvars64.bat sets up (INCLUDE, LIB, PATH).
      - name: Set up the MSVC environment
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }

      # The pinned WinFsp release MSI from github.com/winfsp/winfsp, checked against its SHA-256.
      # ADDLOCAL=ALL adds the Developer feature: the headers and import library in inc and lib.
      - name: Install WinFsp
        run: |
          $msi = "$env:RUNNER_TEMP\winfsp-2.1.25156.msi"
          Invoke-WebRequest -Uri https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($hash -ne "073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a") { throw "WinFsp MSI checksum mismatch: $hash" }
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart ADDLOCAL=ALL" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "msiexec failed with $($install.ExitCode)" }

      - name: Bootstrap vcpkg
        id: vcpkg
        run: |
          .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "commit=$(git rev-parse HEAD:external/vcpkg)" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg installed tree
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-windows-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.commit }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-windows-

      - name: Configure
        id: configure
        run: cmake --preset windows "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR"

      - name: Save vcpkg installed tree
        if: always() && steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset windows -- -k 0

      - name: Test
        run: ctest --preset windows --timeout 60

  # The macOS menu-bar app is a separate Swift package; its tests need no daemon.
  menu-app:
    name: macos-menu-app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos/GhostDriveMenu
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # The GTK 4 desktop app for Linux (linux/ghostdrive-app), built with the rest of the project
  # so the screenshots can run real daemons. Its logic tests also run in the other jobs.
  linux-app:
    name: linux-app
    runs-on: ubuntu-latest
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfuse3-dev libavahi-client-dev \
            libgtk-4-dev libadwaita-1-dev desktop-file-utils \
            xvfb x11-utils xdotool imagemagick dbus

      - name: Bootstrap vcpkg
        id: vcpkg
        run: |
          ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "commit=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"

      # The linux job's dependency tree (same runner, preset and manifest); only restored here.
      - name: Restore vcpkg installed tree
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-default-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.commit }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-default-

      - name: Configure
        run: cmake --preset default -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" -DGHOSTDRIVE_BUILD_LINUX_APP=ON

      - name: Build
        run: >-
          cmake --build --preset default --target ghostdrive-app ghostdrive_app_logic_tests
          ghostdrive_app_contract_tests ghostdrive ghostdrived

      # Only the tests defined in linux/ghostdrive-app: logic, contract and the desktop file.
      - name: Test
        run: ctest --test-dir build/default/linux/ghostdrive-app --output-on-failure

      # The app on a virtual display against throwaway daemons (--no-mount), one shot per page.
      - name: Screenshots
        run: >-
          dbus-run-session -- bash linux/ghostdrive-app/scripts/screenshots.sh build/default
          "$RUNNER_TEMP/screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-app-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  # The WinUI 3 desktop app (windows/GhostDriveApp), separate from the windows job: the
  # GhostDriveApp.Core tests, a self-contained build of the app, and a UI check that starts it
  # against throwaway daemons (--no-mount) and uploads screenshots of its pages.
  windows-app:
    name: windows-app
    runs-on: windows-latest
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/GhostDriveApp/global.json

      - name: Test GhostDriveApp.Core
        working-directory: windows/GhostDriveApp
        run: dotnet test GhostDriveApp.Core.Tests -c Release

      - name: Build the app
        working-directory: windows/GhostDriveApp
        run: |
          dotnet publish GhostDriveApp -c Release -o "$env:RUNNER_TEMP\GhostDriveApp"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $files = Get-ChildItem -Recurse -File "$env:RUNNER_TEMP\GhostDriveApp"
          "{0} files, {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)

      # ghostdrive.exe and ghostdrived.exe for the UI check, from the windows preset with the
      # vcpkg tree the windows job caches (restored only; that job saves it).
      - name: Set up the MSVC environment
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }

      - name: Bootstrap vcpkg
        id: vcpkg
        run: |
          .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "commit=$(git rev-parse HEAD:external/vcpkg)" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg installed tree
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-windows-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.commit }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-windows-

      - name: Build ghostdrive and ghostdrived
        run: |
          cmake --preset windows "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset windows --target ghostdrive ghostdrived

      - name: UI check
        run: >
          ./windows/GhostDriveApp/ci/ui-check.ps1
          -App "$env:RUNNER_TEMP\GhostDriveApp"
          -Cli "$pwd\build\windows\cli\ghostdrive.exe"
          -Daemon "$pwd\build\windows\daemon\ghostdrived.exe"
          -OutDir "$env:RUNNER_TEMP\screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-screenshots
          path: ${{ runner.temp }}\screenshots
          if-no-files-found: warn
